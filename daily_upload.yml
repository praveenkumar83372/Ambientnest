name: AmbientNest HQ — Daily 5-Slot Upload

on:
  schedule:
    - cron: "0 6  * * *"   # Slot 1 — Finance & Crypto
    - cron: "0 10 * * *"   # Slot 2 — AI & Technology
    - cron: "0 14 * * *"   # Slot 3 — History & World Stories
    - cron: "0 18 * * *"   # Slot 4 — Science, Space & Nature
    - cron: "0 22 * * *"   # Slot 5 — Travel, Culture & Facts
  workflow_dispatch:
    inputs:
      slot_override:
        description: "Force a specific slot (1-5). Leave empty to auto-detect."
        required: false

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"      >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}"      >> .env
          echo "FREESOUND_API_KEY=${{ secrets.FREESOUND_API_KEY }}" >> .env

      - name: Reconstruct YouTube auth files
        run: |
          echo "${{ secrets.CLIENT_SECRETS_JSON_B64 }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_PICKLE_B64 }}"        | base64 -d > token.pickle

      - name: Run pipeline
        run: python main.py

      - name: Upload rendered video as artifact (3-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambientnest-output-${{ github.run_id }}
          path: "*.mp4"
          if-no-files-found: ignore
          retention-days: 3