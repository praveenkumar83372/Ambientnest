name: Run YouTube Automation Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 12:00 UTC

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode YouTube OAuth Token
        run: |
          if [ -n "${{ secrets.TOKEN_PICKLE_B64 }}" ]; then
            echo "${{ secrets.TOKEN_PICKLE_B64 }}" | base64 -d > token.pickle
            echo "✅ Decoded token.pickle successfully."
          else
            echo "⚠️ TOKEN_PICKLE_B64 secret is missing!"
          fi

      - name: Run Orchestrator Pipeline
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python orchestrator.py

      - name: Commit and Push Updated Channel State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_state.json current_script.json asset_history.json || true
          git commit -m "auto: update channel state and script logs [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}