name: AmbientNest HQ — 24/7 Lo-fi Stream

on:
  schedule:
    # Restarts every 5h30m — overlaps by 15min so viewers never feel a gap
    # Times UTC: 00:00, 05:30, 11:00, 16:30, 22:00
    - cron: "0 0  * * *"
    - cron: "30 5 * * *"
    - cron: "0 11 * * *"
    - cron: "30 16 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # manual trigger from Actions tab

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h hard GitHub limit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client python-dotenv

      - name: Reconstruct YouTube auth
        run: |
          echo "${{ secrets.TOKEN_PICKLE_B64 }}" | base64 -d > token.pickle

      - name: Update YouTube Stream Metadata
        run: python stream_meta.py

      - name: Start lo-fi stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: python stream.py
