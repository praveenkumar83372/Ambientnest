name: AmbientNest HQ — Weekly Series

on:
  schedule:
    - cron: "0 8 * * 1"
    - cron: "0 8 * * 2"
    - cron: "0 8 * * 3"
    - cron: "0 8 * * 4"
    - cron: "0 8 * * 5"
  workflow_dispatch: {}

jobs:
  produce-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "FREESOUND_API_KEY=${{ secrets.FREESOUND_API_KEY }}" >> .env

      - name: Reconstruct YouTube auth
        run: |
          echo "${{ secrets.CLIENT_SECRETS_JSON_B64 }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_PICKLE_B64 }}" | base64 -d > token.pickle

      - name: Run series pipeline
        run: python main_series.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-output-${{ github.run_id }}
          path: "*.mp4"
          if-no-files-found: ignore
          retention-days: 3