name: Financial Video Automation Pipeline

on:
  schedule:
    # 1. Morning Short: 01:30 UTC = 07:00 AM IST
    # 2. Daily Long-Form Video: 08:30 UTC = 02:00 PM IST
    # 3. Evening Short: 13:00 UTC = 06:30 PM IST
    - cron: '30 1,8 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual triggers anytime from GitHub

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, ImageMagick & Espeak)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick espeak
          # Fix security policy configuration for ImageMagick TextClip rendering in MoviePy
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Channel State & Asset History Cache
        uses: actions/cache@v4
        with:
          path: |
            channel_state.json
            asset_history.json
            finance_sfx/cache.json
          key: finance-channel-memory-${{ github.run_id }}
          restore-keys: |
            finance-channel-memory-

      - name: Execute C-Suite Orchestration & Video Production
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
        run: |
          if [ -n "$TOKEN_PICKLE_B64" ]; then
            echo "$TOKEN_PICKLE_B64" | base64 -d > token.pickle
          fi

          CURRENT_HOUR=$(date -u +%H)
          if [ "$CURRENT_HOUR" -eq "08" ]; then
            echo "🎬 Running 10-Minute Long-Form Documentary Engine..."
            python longform_orchestrator.py
          else
            echo "📱 Running 20-Second Short Engine..."
            python orchestrator.py
          fi

      - name: Commit & Push Updated Memory State
        if: always()
        run: |
          git config --global user.name "FinanceBot Auto"
          git config --global user.email "bot@github.actions"
          git add channel_state.json asset_history.json || true
          git commit -m "update: sync agent memory & topic state [skip ci]" || true
          git push || true