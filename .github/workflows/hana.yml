name: Hana's World — Daily Pipeline

on:
  schedule:
    # All times UTC. JST = UTC+9.
    - cron: "0 22 * * *"   # 07:00 JST — morning video
    - cron: "0 4  * * *"   # 13:00 JST — midday video
    - cron: "0 10 * * *"   # 19:00 JST — evening video
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a specific slot (morning/midday/evening). Leave blank for auto-detect."
        required: false
        default: ""

jobs:
  produce-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai huggingface_hub requests edge-tts pillow

      - name: Determine slot from cron schedule
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
              "0 4 * * *")  echo "slot=midday" >> "$GITHUB_OUTPUT" ;;
              "0 10 * * *") echo "slot=evening" >> "$GITHUB_OUTPUT" ;;
              *) echo "slot=" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Run Hana's World pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "${{ steps.slot.outputs.slot }}" ]; then
            python hana_world.py --slot ${{ steps.slot.outputs.slot }}
          else
            python hana_world.py
          fi

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: hana-video-${{ github.run_id }}
          path: output/final/*.mp4
          retention-days: 14

      - name: Commit updated state
        run: |
          git config user.name "hana-world-bot"
          git config user.email "actions@github.com"
          git add hana_state.json
          git diff --staged --quiet || git commit -m "Update Hana's state after ${{ steps.slot.outputs.slot }} video"
          git push

      # Optional: add a YouTube upload step here once you wire up OAuth
      # credentials as secrets (YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN).
      # Left manual for now so you can review each video before it goes live.
